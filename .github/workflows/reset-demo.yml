# Resets the public demo (getfieldwork.vercel.app) to the original Larkspur & Co. studio every day, so changes
# visitors make never pile up. It seeds a throwaway Postgres on the runner, then copies the result to Neon with
# pg_restore in a single transaction: if anything fails, the live demo keeps its current data.
#
# Needs the repository secret NEON_DATABASE_URL (Neon's direct, unpooled connection string), set once by
# deploy/setup-auto-reset.ps1. Run it by hand from the Actions tab ("Run workflow") before an interview.
name: Reset live demo

on:
  schedule:
    - cron: '0 4 * * *' # every day at 04:00 UTC (12:00 in Manila)
  workflow_dispatch:

concurrency:
  group: reset-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fieldwork
          POSTGRES_PASSWORD: fieldwork
          POSTGRES_DB: fieldwork_seed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check the database secret is set
        env:
          TARGET_DB: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$TARGET_DB" ]; then
            echo "::error::The NEON_DATABASE_URL secret is not set. Run deploy/setup-auto-reset.ps1 once."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Install the API's Composer packages
        working-directory: api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build the demo studio in the runner's Postgres
        working-directory: api
        env:
          APP_ENV: local
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: fieldwork_seed
          DB_USERNAME: fieldwork
          DB_PASSWORD: fieldwork
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          LOG_CHANNEL: stderr
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          php artisan migrate:fresh --seed --force

      - name: Copy it to Neon in one transaction
        env:
          TARGET_DB: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          docker run --rm --network host -e PGPASSWORD=fieldwork -e TARGET_DB -v /tmp:/w postgres:17-alpine sh -c '
            pg_dump -h 127.0.0.1 -U fieldwork -d fieldwork_seed -Fc --no-owner --no-acl -f /w/demo.dump &&
            pg_restore --no-owner --no-acl --clean --if-exists --single-transaction -d "$TARGET_DB" /w/demo.dump'

      - name: Confirm the live demo answers
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -s --max-time 30 https://getfieldwork.vercel.app/api/demo-accounts || true)
            case "$body" in *larkspur.test*) echo "Live demo is serving the reset studio."; exit 0;; esac
            sleep 10
          done
          echo "::error::The reset finished but the live demo did not list the demo accounts."
          exit 1
