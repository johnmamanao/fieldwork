<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork — punch cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
/* Fieldwork, punch cut. 60 s at 120 BPM: cuts on beats, type slams, real numbers as the heroes.
   Every visual is a pure function of t (window.__seek). Real captures in media/. */
:root{ --ink:#121214; --ink2:#1c1b1e; --verm:#f0512a; --verm-d:#b4351a; --coral:#ffcdbd; --light:#f5f4f2; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ink);color:#fff}
#cam{position:absolute;inset:0;will-change:transform}
canvas.full{position:absolute;inset:0;width:1920px;height:1080px}
.glow{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 45%, rgba(240,81,42,.28), transparent 70%);pointer-events:none}
.layer{position:absolute;inset:0;display:none}
.mono{font-family:"Geist Mono",monospace}

/* type */
#word{position:absolute;left:0;right:0;top:390px;text-align:center;font-size:260px;font-weight:800;letter-spacing:-.05em;line-height:1}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.045em;line-height:1.02}
.cap{position:absolute;left:0;right:0;top:930px;text-align:center;font-size:64px;font-weight:700;letter-spacing:-.03em;color:#fff}
.cap b{color:var(--verm);font-weight:800}
.ghost{position:absolute;left:0;right:0;text-align:center;font:600 340px "Geist Mono",monospace;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:3px rgba(240,81,42,.35);top:250px}
.num{position:absolute;font:600 150px "Geist Mono",monospace;letter-spacing:-.04em;color:#fff;text-shadow:0 20px 60px rgba(0,0,0,.6);white-space:nowrap}
.num small{display:block;font:600 40px Manrope,sans-serif;letter-spacing:-.01em;color:var(--coral);margin-top:6px}
.stamp{position:absolute;padding:12px 30px;border:8px solid var(--verm);color:var(--verm);font:600 104px "Geist Mono",monospace;letter-spacing:.04em;text-transform:uppercase;background:rgba(18,18,20,.82);white-space:nowrap}

/* product windows, tilted in 3D and snapped flat on the beat */
.persp{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 45%}
.win{position:absolute;left:760px;top:150px;width:1060px;height:660px;border-radius:20px;overflow:hidden;background:#fff;transform-style:preserve-3d;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 60px 140px -40px rgba(0,0,0,.8),0 0 120px -10px rgba(240,81,42,.35)}
.win img{position:absolute;left:0;top:0;transform-origin:0 0;display:none}
.ring{position:absolute;border-radius:12px;box-shadow:0 0 0 6px var(--verm),0 0 0 20px rgba(240,81,42,.25);opacity:0;pointer-events:none}
.tile{position:absolute;width:640px;height:400px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.tile img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.tl{position:absolute;left:18px;bottom:16px;padding:8px 16px;background:var(--ink);color:#fff;font:600 30px "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase}

/* skyline panel */
#skyp{position:absolute;left:760px;top:120px;width:1060px;height:713px;border-radius:22px;overflow:hidden;background:#f3f3f4;box-shadow:0 60px 140px -40px rgba(0,0,0,.8),0 0 140px -10px rgba(240,81,42,.4)}
#skyp img{position:absolute;inset:0;width:100%;height:100%;display:none}
.stat{position:absolute;left:110px;font:600 112px "Geist Mono",monospace;letter-spacing:-.04em;color:#fff;white-space:nowrap}
.stat small{display:block;font:600 36px Manrope,sans-serif;color:var(--coral);letter-spacing:-.01em;margin-top:4px}

/* montage */
#mont .frame{position:absolute;left:160px;top:90px;width:1600px;height:1000px;border-radius:22px;overflow:hidden;background:#fff;transform-origin:50% 40%}
#mont .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;display:none}
#mont .lab{position:absolute;left:120px;bottom:120px;padding:18px 34px;background:var(--verm);color:var(--ink);font:800 120px Manrope,sans-serif;letter-spacing:-.04em;line-height:1}

/* devices */
#dev .desk{position:absolute;left:150px;top:150px;width:1240px;height:775px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 60px 140px -40px rgba(0,0,0,.8)}
#dev .desk img,#dev .ph img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
#dev .ph{position:absolute;left:1430px;top:120px;width:380px;height:822px;border-radius:44px;overflow:hidden;border:12px solid #2a292c;background:#fff;box-shadow:0 60px 140px -40px rgba(0,0,0,.9)}

/* end card */
#end .line{position:absolute;left:0;right:0;top:660px;text-align:center;font-size:54px;font-weight:600;letter-spacing:-.02em;color:#fff}
#end .cta{position:absolute;left:50%;top:790px;height:92px;padding:0 48px;display:flex;align-items:center;background:var(--verm);color:var(--ink);font:600 38px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;transform:translateX(-50%)}
#end .cta::before,#end .cta::after{content:'';position:absolute;width:24px;height:34px;background:var(--verm)}
#end .cta::before{left:-14px;bottom:14px} #end .cta::after{right:-14px;top:14px}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:12px 18px;background:rgba(0,0,0,.6);color:#aaa;font:13px ui-monospace,Menlo,monospace;z-index:10}
#hud input{flex:1} #hud button{background:#222;color:#ddd;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
body.render #hud{display:none}
</style>
</head>
<body>
<div id="stage"><div id="cam">
  <canvas id="bg" class="full" width="1920" height="1080"></canvas>
  <div class="glow" id="glow"></div>

  <section class="layer" id="sWords"><div id="word"></div></section>

  <section class="layer" id="sTiles">
    <div class="big" id="tilesT" style="top:80px;font-size:96px">Four tools. <span style="color:var(--verm)">Four truths.</span></div>
    <div id="tiles"></div>
    <div class="big" id="oneT" style="top:860px;font-size:150px;color:var(--verm)">One record.</div>
  </section>

  <section class="layer" id="sClaim"><div class="big" id="claimT" style="top:330px;font-size:150px"></div></section>

  <section class="layer" id="sChain">
    <div class="ghost" id="ghost"></div>
    <div class="persp"><div class="win" id="win"><div class="ring" id="ring"></div><div class="ring" id="ring2"></div><div class="ring" id="ring3"></div></div></div>
    <div class="num" id="num"></div>
    <div class="stamp" id="stamp"></div>
    <div class="cap" id="cap"></div>
  </section>

  <section class="layer" id="sSky">
    <div id="skyp"></div>
    <div class="stat" id="st0" style="top:250px">5,966 h<small>billable, last 26 weeks</small></div>
    <div class="stat" id="st1" style="top:470px">59 h<small>busiest day · Jun 1</small></div>
    <div class="stat" id="st2" style="top:690px">45 days<small>longest workday streak</small></div>
    <div class="cap" id="skyCap" style="top:930px">Every hour, <b>on the record.</b></div>
  </section>

  <section class="layer" id="mont"><div class="frame" id="mframe"></div><div class="lab" id="mlab"></div></section>

  <section class="layer" id="dev">
    <div class="desk" id="desk"><img src="media/web/tour-overview.webp" alt=""></div>
    <div class="ph" id="ph"><img src="media/web/phone.webp" alt=""></div>
    <div class="cap" id="devCap">Built for desktop <b>and phone.</b></div>
  </section>

  <section class="layer" id="sOut"><div class="big" id="outT" style="top:360px;font-size:140px"></div></section>

  <section class="layer" id="end"><canvas id="word2" class="full" width="1920" height="1080"></canvas>
    <div class="line" id="endLine">Time, invoices and payments for studios.</div>
    <div class="cta" id="cta">Open the demo studio</div></section>

  <canvas id="pix" class="full" width="1920" height="1080"></canvas>
  <div id="flash"></div>
</div></div>
<div id="hud"><button id="play">Pause</button><input id="scrub" type="range" min="0" step="0.01"><span id="time">0.00</span></div>
<script>
/* ---------- film contract ---------- */
const FILM = {duration: 60, width: 1920, height: 1080, bpm: 120};
const BEAT = 60 / FILM.bpm, BAR = 4 * BEAT;
window.__film = FILM;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  out: p => 1 - (1 - p) ** 3, out5: p => 1 - (1 - p) ** 5,
  inOut: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2,
  back: p => { const c = 1.9; return 1 + (c + 1) * (p - 1) ** 3 + c * (p - 1) ** 2; },
  in3: p => p ** 3,
};
function hash(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
// a slam: scale from big to 1 with a fast ease, fade in, and an optional hold-out
function slam(el, t, at, {from = 1.35, dur = .16, out = 1e9, outDur = .12, y = 0} = {}) {
  const p = E.out5(prog(t, at, at + dur)), o = prog(t, out, out + outDur);
  el.style.opacity = p * (1 - o);
  el.style.transform = `translateY(${y}px) scale(${lerp(from, 1, p) * (1 - .06 * o)})`;
}
const money = (c) => '$' + (c / 100).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

/* ---------- background: ink, or the hours grid ---------- */
const BG = $('bg').getContext('2d');
const LEVELS = ['#121214', '#3b140a', '#6e2210', '#982b15', '#b4351a', '#cf411d', '#e64d24', '#fb6a3d', '#ff9a78'];
function drawGrid(t, clearW = .42, clearH = .3) {
  const c = 40, gap = 7, sq = c - gap, cols = Math.ceil(1920 / c) + 1, rows = Math.ceil(1080 / c) + 1;
  BG.fillStyle = '#b4351a'; BG.fillRect(0, 0, 1920, 1080);
  const today = (t * 14) % (cols + 6) - 3;
  for (let x = 0; x < cols; x++) {
    const week = .55 + .45 * hash(Math.floor(x / 3), 0, 5);
    for (let y = 0; y < rows; y++) {
      const day = y % 7, rhythm = day >= 5 ? .12 : [.75, .9, 1, .92, .7][day];
      const hours = Math.min(1, rhythm * week * (.55 + .6 * hash(x, y, 5)));
      const u = (x * c + c / 2) / 1920, v = (y * c + c / 2) / 1080;
      const calm = clamp(((((u - .5) / clearW) ** 2 + ((v - .48) / clearH) ** 2) - .55) / .9);
      const near = Math.max(0, 1 - Math.abs(x - today) / 1.6);
      const lvl = 4 + (hours * 4.4 - 1.4) * calm + near * 2.6 * calm + (x < today ? .35 : 0) * calm;
      const i = Math.max(0, Math.min(8, Math.round(lvl)));
      if (i === 4) continue;
      BG.fillStyle = LEVELS[i]; BG.fillRect(x * c, y * c, sq, sq);
    }
  }
}
function drawInk() { BG.fillStyle = '#121214'; BG.fillRect(0, 0, 1920, 1080); }

/* ---------- one pixel burst, into the end card ---------- */
const PX = $('pix').getContext('2d');
const BURSTS = [52.0];
function drawPix(t) {
  PX.clearRect(0, 0, 1920, 1080);
  const b = BURSTS.find(x => t >= x - .22 && t < x + .3); if (b === undefined) return;
  const c = 60, cols = 32, rows = 18;
  for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++) {
    const h = hash(x, y, Math.round(b * 10)), d = (x / cols) * .14 + h * .08;   // a sweep left to right with grain
    const on = t >= b - .22 + d && t < b + .02 + d * 1.4;
    if (!on) continue;
    PX.fillStyle = h > .66 ? '#ff9a78' : h > .3 ? '#f0512a' : '#b4351a';
    PX.fillRect(x * c, y * c, c - 4, c - 4);
  }
}

/* ---------- camera shake on impacts: the drops and the two real locks ---------- */
const SHAKES = [4.0, 20.5, 21.0, 21.5, 28.0, 52.0];
function shake(t) {
  let dx = 0, dy = 0, s = 1;
  for (const h of SHAKES) { const k = t - h; if (k >= 0 && k < .35) { const a = (1 - k / .35) ** 2 * 18; dx += Math.sin(k * 90) * a; dy += Math.cos(k * 70) * a * .7; s += (1 - k / .35) ** 3 * .02; } }
  $('cam').style.transform = `translate(${dx}px,${dy}px) scale(${s})`;
}
// a white frame on the biggest hits
const FLASHES = [4.0, 28.0, 52.0];
function flash(t) { let o = 0; for (const f of FLASHES) { const k = t - f; if (k >= 0 && k < .18) o = Math.max(o, (1 - k / .18) * .55); } $('flash').style.opacity = o; }

/* ---------- A: four words, one per beat ---------- */
const WORDS = [[0.0, 'HOURS', '#fff'], [0.5, 'APPROVALS', '#f0512a'], [1.0, 'INVOICES', '#fff'], [1.5, 'PAYMENTS', '#f0512a']];

      const tx = lerp(x[2], 640, merge), ty = lerp(x[3], 340, merge);
      el.style.left = tx + jit + 'px'; el.style.top = ty + 'px';
      el.style.opacity = clamp(prog(t, at, at + .1)) * (1 - prog(t, 4.1, 4.2));
      el.style.transform = `rotate(${x[4] * (1 - merge)}deg) scale(${lerp(.6, 1, clamp(p)) * lerp(1, .7, merge)})`;
    });
    slam($('oneT'), t, 4.05, {from: 1.8, dur: .16, y: -340 * 0});
    if (t < 4.05) $('oneT').style.opacity = 0;
    $('oneT').style.top = '400px';
  }
  if (seg === 'claim') {
    $('claimT').innerHTML = 'Approved hours,<br><span style="color:#ffcdbd">billed once.</span>';
    slam($('claimT'), t, 6.0, {from: 1.25, dur: .2, out: 7.85, outDur: .12});
  }
  if (seg === 'chain') renderChain(t);
  if (seg === 'sky') renderSky(t);
  if (seg === 'mont') renderMont(t);
  if (seg === 'dev') renderDev(t);
  if (seg === 'out') {
    const words = ['Every', 'approved', 'hour,', 'billed', 'once.'], n = Math.min(words.length, 1 + Math.floor((t - 48) / BEAT));
    $('outT').innerHTML = words.slice(0, n).map((w, i) => i >= 3 ? `<span style="color:#ffcdbd">${w}</span>` : w).join(' ').replace('hour, ', 'hour,<br>');
    slam($('outT'), t, 48 + (n - 1) * BEAT, {from: 1.06, dur: .12});
    $('outT').style.opacity = 1;
  }
  if (seg === 'end') {
    drawWord(t);
    slam($('endLine'), t, 53.5, {from: 1.1, dur: .3});
    slam($('cta'), t, 54.5, {from: 1.25, dur: .2});
    $('cta').style.transform += ' translateX(-50%)';
  }
  drawPix(t); shake(t); flash(t);
}

/* ---------- player (hidden with ?render) ---------- */
function fit() { const s = Math.min(innerWidth / FILM.width, innerHeight / FILM.height), st = $('stage');
  st.style.transform = `scale(${s})`; st.style.left = (innerWidth - FILM.width * s) / 2 + 'px'; st.style.top = (innerHeight - FILM.height * s) / 2 + 'px'; }
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
addEventListener('resize', fit); fit();
$('scrub').max = FILM.duration;
let playing = !RENDER, t0 = performance.now(), cur = 0;
const audio = RENDER ? null : new Audio('mix.m4a');
function seek(t) { cur = t; render(t); $('scrub').value = t; $('time').textContent = t.toFixed(2); }
window.__seek = t => { render(t); return t >= 8 && t < 28 ? recReady().then(() => true) : true; };
window.__ready = Promise.all([document.fonts.load('800 120px Manrope'), document.fonts.load('600 60px "Geist Mono"'), document.fonts.ready,
  ...[...document.images].map(i => i.decode().catch(() => {}))]);
function tick(now) { if (playing) { cur = ((now - t0) / 1000) % FILM.duration; seek(cur); } requestAnimationFrame(tick); }
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; t0 = performance.now() - cur * 1000;
  if (audio) { if (playing) { audio.currentTime = cur; audio.play().catch(() => {}); } else audio.pause(); } };
$('scrub').oninput = e => { playing = false; audio?.pause(); $('play').textContent = 'Play'; seek(+e.target.value); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); } });
window.__ready.then(() => { t0 = performance.now(); if (!RENDER) requestAnimationFrame(tick); else render(0); });
</script>
